spring:
  datasource:
    url: ${LEXICONLAIR_PG_URL:jdbc:postgresql://localhost:5432/lexiconlair}
    username: ${LEXICONLAIR_PG_USERNAME:lexiconlair-user}
    password: ${LEXICONLAIR_PG_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    generate-ddl: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      platform: postgresql
