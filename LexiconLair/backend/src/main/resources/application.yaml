spring:
  application:
    name: LexiconLair
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgresql}
  mvc:
    format:
      date: yyyy-MM-dd
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true

server:
  port: 8080
  error:
    include-messages: always

logging:
  level:
    org.springframework: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.ronanos.lexiconlair: DEBUG
